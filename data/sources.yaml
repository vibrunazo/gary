# Provenance index for local datasets in data/raw/.
# One entry per source folder. Keep this updated when adding a source.
#
# redistributable: whether files from this source may be committed to the repo
#   (e.g. as test fixtures). "unknown" means no.

sources:
  - id: stardata
    path: raw/stardata
    name: STARDATA
    url: https://github.com/TorchCraft/StarData
    license: BSD (plus patent grant), see the StarData repo
    redistributable: yes        # with attribution
    game_version: "1.16.1"
    notes: >-
      65,646 original replays in 20 numbered folders, plus the dataset's own split lists
      (train/valid/test, small*, first1k, all) and map-name JSON. No TorchCraft dumps yet.
    count: 65646
    downloaded: "2026-10"

  - id: tl
    path: raw/tl
    name: TeamLiquid community replay packs
    url: https://tl.net/forum/brood-war/
    license: unknown (varies per pack)
    redistributable: unknown
    game_version: mixed
    notes: one subfolder per pack.
    packs:
      - id: sataNik
        path: raw/tl/sataNik
        url: https://tl.net/forum/brood-war/584979-satanik-replay-pack
        count: 567
        notes: also contains the original "sata new.rar" archive next to its extracted files.
      - id: incontrol
        path: raw/tl/incontrol
        url: https://tl.net/forum/brood-war/604990-looking-for-replay-pack-old-media-games
        count: 387
      - id: progames
        path: raw/tl/progames
        notes: >-
          Pro players' replay folders, one subfolder per original pack name.
        subpacks:
          - id: BoxeR
            url: https://tl.net/forum/brood-war/641857-old-rep-packs-of-bw-legends
            count: 519
            notes: >-
              Only the BoxeR folders were downloaded; likely practice games.
              Contains replay-manager cache files (repcache, RplDB.db) that the inventory ignores.
          - id: tl-replay-packs-thread
            url: https://tl.net/forum/brood-war/531338-replay-packs
            folders:
              - "680 Progamer reps"
              - "Bisu"
              - "China vs Korea"
              - "ESCvsKorea"
              - "Europe vs Korea 1-6"
              - "FlaSh"
              - "IEF2008"
              - "IEF2009 Korean Prelim"
              - "IEF2009 Replays"
              - "IpxZerg[gm]"
              - "JulyZerg"
              - "Korea vs usa"
              - "NADA"
              - "Nal_rA"
              - "Pro-Semipro reps"
              - "STX Cup Masters (2010)"
              - "Star replays from Korea"
              - "anytime"
              - "pro"
              - "replay heaven 3"
              - "ygosu"
            notes: >-
              Many replays with mangled extensions (handled by the inventory), unextracted
              .rar/.zip archives (Bisu, FlaSh, IEF2009, several in "Star replays from Korea"),
              incomplete .part downloads and .lnk shortcuts (ignored), and a bundled
              "StarCraft 1.15.3.exe" in "680 Progamer reps" that must never be run.
    downloaded: "2026-10"

  - id: cwal
    path: raw/cwal
    name: cwal.gg ladder replays
    url: https://cwal.gg/
    license: site terms
    redistributable: no         # ladder players' accounts and in-game chat
    game_version: "SC:R"
    count: 35
    notes: >-
      High-MMR TvZ ladder games, plus a Pluto/ subfolder with games from accounts cwal tags as
      the Pluto bot (Pluto--AI, Pluto_ProMax, cxbdfgdfjhdfjdj). Pluto games are never used for
      training; they are "not human" examples for the humanlikeness classifier.
    downloaded: "2026-10"

  - id: vib
    path: raw/vib
    name: Contributor's own games
    license: CC0 1.0
    redistributable: yes
    game_version: "SC:R"
    notes: Games played by a project contributor (vs. the computer so far). Usable as fixtures.
    count: 1
    downloaded: "2026-10"
